<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POST-ITS</title>
    

    <style>
        h4{ font-family:'Times New Roman', Times, serif; font-size: 1.5rem; color: hsl(0, 0%, 20%); margin: 0; }

         body{
        background-image: url('./back.jpg'); 
            background-repeat: no-repeat; 
            background-position: center; 
            background-size: cover; 
            background-attachment: fixed; 
      }
      header{
        text-align: center;
        background-color: #3e2a07;
      }
button{
    font-size: 1.7rem;
    font-weight: bold;
    padding: 10px 20px;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.5s ease;
}

h1{
    font-size: 4rem;
    color: rgb(132, 225, 233);
}

.add-button{ font-size: 15px;
    background-color: hsl(125, 24%, 28%);
}
.add-button:hover{
    background-color: hsl(125, 47%, 44%);
}
.delete-button{
    background-color: hsl(10, 82%, 62%);
}
.delete-button:hover{
    background-color: hsl(10, 90%, 40%);
}
.move-button{
    background-color: hsl(206, 36%, 32%);
}
.move-button:hover{
    background-color: hsl(207, 90%, 54%);
}
input[type="text"]{
    font-size: 1rem;
    padding: 10px; margin:5px; 
    border: 2px solid hsla(0, 0%, 80%, 0.5);
    border-radius: 5px;
    color: hsla(0, 0%, 0%, 0.5); background-color: hsl(173, 56%, 77%);
}
ol{
    padding: 0;
}
li{
    font-size: 2rem;
    font-weight: bold;
    padding: 10px;
    background-color: hsl(0, 0%, 97%);
    margin-bottom: 10px;
    border: 3px solid hsla(0, 0%, 85%, 0.75);
    border-radius: 5px;
    display: flex;
    align-items: center;
}
.text{
    flex: 1;
}
.delete-button, .move-button{
    padding: 8px 12px;
    font-size: 15px;
    margin-left: 10px;
}
    </style>

   
</head>
<body>

     <script>
       
        let currentEditingId = null;

        window.onload = function() {
            getPosts();
        };

        function toggleForm() {
            const formContainer = document.getElementById("newPostFormContainer");
            if (formContainer.style.display === "none" || formContainer.style.display === "") {
                formContainer.style.display = "block";
            } else {
                formContainer.style.display = "none";
                resetFormState(); 
            }
        }

        function resetFormState() {
            currentEditingId = null;
            document.getElementById("formTitleText").innerText = "Add a New Post-It";
            document.getElementById("submitBtn").value = "Submit Post";
            document.getElementById("title").value = "";
            document.getElementById("author").value = "";
            document.getElementById("body").value = "";
            document.getElementById("category").value = "";
        }


        async function handleFormSubmit() {
            const author = document.getElementById("author").value.trim();
            const title = document.getElementById("title").value.trim();
            const body = document.getElementById("body").value.trim();
            const category = document.getElementById("category").value.trim();

            const payload = { author, title, body, category };
            
            let url = 'http://localhost:5000/posts';
            let method = 'POST';

            if (currentEditingId) {
                url = `http://localhost:5000/posts/${currentEditingId}`;
                method = 'PUT';
            }

            try {
                const response = await fetch(url, {
                    method: method, 
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById("responseMsg").innerText = currentEditingId ? "Post updated successfully!" : "Post created successfully!";
                    document.getElementById("responseMsg").style.color = "green";
                    resetFormState();
                    toggleForm(); 
                    getPosts(); 
                } else {
                    const result = await response.json();
                    document.getElementById("responseMsg").innerText = result.error || "Operation failed";
                    document.getElementById("responseMsg").style.color = "red";
                }
            } catch (err) {
                document.getElementById("responseMsg").innerText = "Network error connecting to backend.";
                document.getElementById("responseMsg").style.color = "red";
            }
        }

        async function getPosts() {
            const listContainer = document.getElementById("postit-list");
            const searchQuery = document.getElementById("searchBar").value.trim();
            
            listContainer.innerHTML = "<li>Loading items...</li>";
            
           
            let targetUrl = 'http://localhost:5000/posts';
            if (searchQuery) {
                targetUrl += `?search=${encodeURIComponent(searchQuery)}`;
            }

            try {
                const response = await fetch(targetUrl);
                const responseData = await response.json();
                const posts = Array.isArray(responseData) ? responseData : (responseData.data || []);
                
                listContainer.innerHTML = ""; 
                if (posts.length === 0) {
                    listContainer.innerHTML = "<li style='font-size: 1.2rem; padding: 15px; font-weight: normal;'>No post-its found.</li>";
                    return;
                }
                posts.forEach(post => {
                    const listItem = document.createElement("li");
                    listItem.innerHTML = `
                        <div class="text">
                            <p style="font-size: 0.85rem; font-weight: normal; color: #555;text-align: left;">Created on: ${new Date(post.createdAt).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</p>
                            <h4 style="font-weight: bold; margin-bottom: 5px;">${post.title} <span style="font-size: 0.9rem; color: #666; font-weight: normal;">[${post.category}]</span></h4>
                            <p style="font-size: 1.1rem; font-weight: normal; margin: 5px 0; background-color: #fffde6; padding: 8px; border-radius: 4px;">${post.content || post.body || ''}</p>
                            <span style="font-size: 0.85rem; font-weight: normal; color: #555;">By: <em>${post.author}</em> </span>
                        </div>
                        <!-- Added operational buttons linked across unique IDs -->
                        <button class="move-button" onclick="prepareUpdate('${post._id}', '${escapeJS(post.title)}', '${escapeJS(post.author)}', '${escapeJS(post.content || post.body || '')}', '${escapeJS(post.category)}')">Edit</button>
                        <button class="delete-button" onclick="deletePostIt('${post._id}')">Delete</button>
                    `;
                    listContainer.appendChild(listItem);
                });
            } catch (err) {
                listContainer.innerHTML = "<li style='color: red; font-size: 1.2rem;'>Error pulling list items.</li>";
            }
        }

        function prepareUpdate(id, title, author, content, category) {
            currentEditingId = id;
            document.getElementById("formTitleText").innerText = "Edit Post-It";
            document.getElementById("submitBtn").value = "Update Post";
            
            document.getElementById("title").value = title;
            document.getElementById("author").value = author;
            document.getElementById("body").value = content;
            document.getElementById("category").value = category;
            
            
            document.getElementById("newPostFormContainer").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

         async function deletePostIt(id) {
            if (!confirm("Are you sure you want to remove this post-it note?")) return;
            try {
                const response = await fetch(`http://localhost:5000/posts/${id}`, { method: "DELETE" });
                if (response.ok) {
                    document.getElementById("responseMsg").innerText = "Post-it deleted.";
                    document.getElementById("responseMsg").style.color = "green";
                    getPosts();
                } else {
                    const result = await response.json();
                    document.getElementById("responseMsg").innerText = result.error || "Delete failed.";
                    document.getElementById("responseMsg").style.color = "red";
                }
            } catch (err) {
                document.getElementById("responseMsg").innerText = "Error deleting from database.";
                document.getElementById("responseMsg").style.color = "red";
            }
        }

        function escapeJS(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        

        }
    </script>

<header><br><br>
        <h1>POST-ITS</h1>
        <br>
        <hr>
        <hr>
        <br>
</header>
  

    <div class="menu">
        <div style="text-align: center;">
          
            <button class="add-button" onclick="toggleForm()" style="padding: 10px 20px; font-size: 20px; cursor: pointer;margin: 30px; background-color: hsl(125, 24%, 28%); color: white; border: none; border-radius: 5px; transition: background-color 0.3s;">
                + Create New Post-It
            </button>
        </div>
    </div>


    <div id="newPostFormContainer" style="display: none; border: 1px solid #ccc; padding: 20px; margin: 20px auto; max-width: 500px; border-radius: 8px; background-color: #f9f9f9;box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
        <h3 id="formTitleText">Add a New Post-It</h3>
        <form onsubmit="event.preventDefault(); handleFormSubmit();">
            <label for="title"><b>Title</b></label><br>
            <input type="text" placeholder="Post Title" id="title" required style="width: 90%; padding: 8px; margin: 10px;"><br>
            
            <label for="author"><b>Author</b></label><br>
            <input type="text" placeholder="Author Name" id="author" required style="width: 90%; padding: 8px; margin: 10px;"><br>
            
            <label for="body"><b>Content</b></label><br>
            <textarea id="body" cols="50" rows="5" required style="width: 90%; padding: 8px; margin: 10px;"></textarea><br>
            
            <label for="category"><b>Category</b></label><br>
            <input type="text" placeholder="Category" id="category" required style="width: 90%; padding: 8px; margin: 10px;"><br>

            <input type="submit" id="submitBtn" value="Submit Post" class="btn" style="padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
        </form>
    </div>

    
    <p id="responseMsg" style="text-align: center; font-weight: bold; color: green;"></p>

   <div style="text-align: center; margin: 20px 0 0 0 ; padding:30px; width:100vw; box-sizing: border-box; background-color: rgba(0, 0, 0, 0.5);">
      <h2 style="text-align: left; color: #fefefe;">All Post-Its</h2>
        <input type="text" id="searchBar" placeholder="Search by title..." oninput="getPosts()" style="width: 60%; padding: 10px; font-size: 1rem; border: 2px solid #ccc; border-radius: 5px;">

    <ol id="postit-list"></ol>

 </div>


</body>
</html>
